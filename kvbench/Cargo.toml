[package]
name = "kvbench"
version = "0.1.0"
edition = "2021"
description = "Low-overhead benchmark for Redis-compatible key-value stores"
license = "Apache-2.0"

[dependencies]
clap = { version = "4", features = ["derive"] }
hdrhistogram = { version = "7", default-features = false }
mio = { version = "1", features = ["os-poll", "net", "os-ext"] }
libc = "0.2"
serde_json = "1"
lz4_flex = { version = "0.11", default-features = false, features = ["safe-encode"] }
zstd = "0.13"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 1
